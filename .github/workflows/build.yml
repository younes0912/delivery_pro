name: Build Delivery Pro APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04  # استخدمنا نسخة أقدم قليلاً لضمان توافق الأدوات
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy kivymd

      - name: Build APK
        run: |
          # تثبيت الأدوات الأساسية المتوفرة في هذه النسخة
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5 libtinfo5 libncursesw5  cmake
          
          # إعداد buildozer وتثبيت المكتبات داخل التطبيق
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd/g' buildozer.spec
          
          # قبول التراخيص وبدء البناء
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-pro-app
          path: bin/*.apk
