name: Build Wassalni Final
on: [push, pull_request]

jobs:
  build:
    # نثبت النسخة على 20.04 لأنها تدعم المكتبات التي يحتاجها أندرويد بشكل أفضل
    runs-on: ubuntu-20.04 
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libgdbm-dev \
            libnss3-dev libreadline-dev wget curl openjdk-17-jdk

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" wheel buildozer

      - name: Ultimate Clean & Build
        run: |
          rm -f buildozer.spec
          rm -rf .buildozer/
          buildozer init
          
          # إعدادات لضمان التوافق التام وتجنب أخطاء الصور السابقة
          sed -i 's/^title = .*/title = Wassalni/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = wassalni/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3==3.9.10,kivy==2.3.0,kivymd==1.2.0,pillow,arabic-reshaper,python-bidi/' buildozer.spec
          
          # تثبيت معمارية واحدة فقط لتجنب استهلاك الذاكرة (حل مشكلة Broken pipe)
          sed -i 's/^#android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # استخدام API 31 المستقر
          sed -i 's/^#android.api = .*/android.api = 31/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          
          # قبول التراخيص قسرياً وبدء البناء
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wassalni-apk
          path: bin/*.apk
