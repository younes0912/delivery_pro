name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy

      - name: Build APK
        run: |
          # تثبيت الأدوات الأساسية
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev
          
          # إنشاء ملف الإعدادات والموافقة على التراخيص
          buildozer init
          sed -i 's/package.name = myapp/package.name = deliverypro/' buildozer.spec
          sed -i 's/title = My Application/title = DeliveryPro/' buildozer.spec
          
          # إجبار النظام على قبول كافة تراخيص الأندرويد (حل مشكلة الصورة الأخيرة)
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-app
          path: bin/*.apk
