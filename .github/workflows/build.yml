name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf autotools-dev libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython kivy
      - name: Build APK with Buildozer
        run: |
          yes | buildozer init
          # هنا نقوم بتعديل اسم التطبيق تلقائياً
          sed -i 's/package.name = myapp/package.name = deliverypro/' buildozer.spec
          sed -i 's/title = My Application/title = Delivery Pro/' buildozer.spec
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-app-apk
          path: bin/*.apk
