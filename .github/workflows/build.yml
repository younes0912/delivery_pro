name: Build Wassalni Final
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libgdbm-dev \
            libnss3-dev libreadline-dev wget curl openjdk-17-jdk

      - name: Install Python Tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" wheel "buildozer>=1.5.0"

      - name: Ultimate Clean & Build
        run: |
          # تنظيف الملفات القديمة التي تسببت في أخطاء الصور السابقة
          rm -f buildozer.spec
          rm -rf .buildozer/
          
          buildozer init
          
          # إعدادات الاستقرار (Golden Configuration)
          sed -i 's/^title = .*/title = Wassalni/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = wassalni/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow,arabic-reshaper,python-bidi/' buildozer.spec
          
          # تثبيت معمارية واحدة فقط لتفادي خطأ Broken pipe الموضح في لقطة الشاشة
          sed -i 's/^#android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # استخدام إصدار SDK مستقر
          sed -i 's/^#android.api = .*/android.api = 31/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          
          # قبول التراخيص قسرياً قبل البدء
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wassalni-apk-v1
          path: bin/*.apk
