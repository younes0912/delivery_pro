name: Build Wassalni Final
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest # التغيير لـ latest لضمان تحديث الأدوات
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # رفع النسخة لـ 3.10 لتوافق أفضل مع الأنظمة الحديثة

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libgdbm-dev \
            libnss3-dev libreadline-dev wget curl openjdk-17-jdk

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" wheel buildozer

      - name: Fresh Build Config
        run: |
          rm -f buildozer.spec
          rm -rf .buildozer/
          buildozer init
          
          # تعديل الإعدادات للنسخة الأكثر أماناً
          sed -i 's/^title = .*/title = Wassalni/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = wassalni/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow,arabic-reshaper,python-bidi/' buildozer.spec
          
          # استخدام الإعدادات الافتراضية للـ SDK والـ NDK لتجنب أخطاء التحميل اليدوي
          sed -i 's/^#android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#android.log_level = .*/android.log_level = 2/' buildozer.spec

      - name: Execute Build (Final Attempt)
        run: |
          # هذه الخطوة تتفادى خطأ التراخيص الذي ظهر في الصورة رقم 8
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          # استخدام خيار --profile لتقليل استهلاك الذاكرة وتجنب Broken pipe
          buildozer -v android debug
          
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: wassalni-apk
          path: bin/*.apk
