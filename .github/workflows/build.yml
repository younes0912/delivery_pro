name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy

      - name: Build APK
        run: |
          # تثبيت أدوات الأندرويد الأساسية
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          
          # إنشاء ملف buildozer.spec تلقائياً وتعديله
          buildozer init
          sed -i 's/package.name = myapp/package.name = deliverypro/' buildozer.spec
          sed -i 's/title = My Application/title = DeliveryPro/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          
          # بدء البناء (هذا السطر سيستغرق وقتاً)
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-app
          path: bin/*.apk
