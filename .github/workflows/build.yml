name: Build Delivery Pro APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy kivymd

      - name: Build APK
        run: |
          # تثبيت المكتبات اللازمة لحل مشكلة libtinfo5 والتراخيص
          sudo apt-get update
          sudo apt-get install -y libncurses5 libtinfo5 zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev
          
          # إعداد buildozer بشكل آلي وتعديل الإعدادات
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE/g' buildozer.spec
          
          # قبول التراخيص وبدء البناء (يحل مشكلة Broken pipe)
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-pro-app
          path: bin/*.apk
